<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prawo planu</title>
<meta name="description" content="Prawo planu / Law Plan – zmiany w polskim prawie budowlanym i planistycznym na żywo: Dziennik Ustaw, nowelizacje kluczowych aktów i projekty ustaw w Sejmie.">
<link rel="preconnect" href="https://api.sejm.gov.pl" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geom:ital,wght@0,300..900;1,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Paleta: Moss #6A6A53 · Olive #9B9879 · Mahogany #4D342D · Egg Shell #EDE7DB · Linen #DDCCB7
   Jeden jasny motyw (świadomie bez trybu ciemnego).
   Układ: nagłówek = tabliczka rysunkowa na oliwkowym tle z siatką; niżej arkusze; wiersz = data | treść | strona */
:root{
  --moss:#6A6A53; --olive:#9B9879; --mahogany:#4D342D; --eggshell:#EDE7DB; --linen:#DDCCB7;
  --paper:#EDE7DB; --sheet:#F7F3EC; --ink:#4D342D; --mut:#62624C; --line:#DDCCB7; --line-strong:#9B9879;
  --acc:#5A5A45; --acc-soft:#E6E3D2;
  --head-bg:#9B9879; --head-ink:#FFFFFF; --head-mut:rgba(255,255,255,.9); --head-line:rgba(255,255,255,.55); --head-grid:rgba(255,255,255,.09);
  --btn-bg:#4D342D; --btn-ink:#FFFFFF;
  --hi:#8A3B2B; --hi-soft:#F1DDD3; --mid:#6E5A1E; --mid-soft:#EEE5CB; --ok:#4F5139; --ok-soft:#E2E2CF; --lo:#7E786A; --lo-soft:#E8E1D4;
  --new:#4D342D; --new-ink:#EDE7DB; --kind-bg:#DDCCB7; --kind-ink:#4D342D;
  --f-display:"Geom","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Geom","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
html{background:var(--paper)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head-bg)}
a{color:var(--acc);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{display:block;font:500 10.5px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}

/* tabliczka rysunkowa */
.tb{background-color:var(--head-bg);color:var(--head-ink);background-image:linear-gradient(var(--head-grid) 1px,transparent 1px),linear-gradient(90deg,var(--head-grid) 1px,transparent 1px);background-size:16px 16px;padding-block:calc(env(safe-area-inset-top,0px) + 30px) 22px}
.tb .lbl{color:var(--head-mut);font-weight:600}
.tb h1,.tb p,.tb b,.tb .lbl,.tb .status{text-shadow:0 1px 2px rgba(47,32,27,.28)}
.tb-grid{display:grid;grid-template-columns:minmax(0,2.3fr) repeat(3,minmax(0,1fr)) auto;border:1.5px solid var(--head-line)}
.tb-grid>div{padding:12px 16px;border-left:1px solid var(--head-line);min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tb-grid>div:first-child{border-left:none}
h1{font:700 clamp(34px,5vw,52px)/1.05 var(--f-display);margin:4px 0 0;letter-spacing:-.02em;text-wrap:balance}
.tb-name p{margin:4px 0 0;color:var(--head-mut);font-size:14.5px;font-weight:500;max-width:52ch}
.tb-cell b{font:500 14px/1.35 var(--f-mono);overflow-wrap:anywhere}
.tb-act{align-items:stretch;justify-content:center!important}
.btn{font:600 14px var(--f-body);background:var(--btn-bg);color:var(--btn-ink);border:0;border-radius:6px;padding:10px 18px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.18)}
.btn:disabled{opacity:.6;cursor:progress}
.lang{display:inline-flex;border:1px solid var(--head-line);border-radius:6px;overflow:hidden;align-self:stretch}
.lang button{flex:1;font:600 12px var(--f-mono);letter-spacing:.06em;background:transparent;color:var(--head-mut);border:0;padding:7px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:12px 0 0;font-size:13px;color:var(--head-mut)}
.bar{flex:0 1 240px;height:4px;background:var(--head-line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--btn-bg);transition:width .2s}
@media (max-width:820px){
  .tb-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tb-grid>div{border-left:none;border-top:1px solid var(--head-line)}
  .tb-grid>div:first-child{grid-column:1/-1;border-top:none}
  .tb-grid>div:nth-child(3),.tb-grid>div:nth-child(5){border-left:1px solid var(--head-line)}
}

/* nawigacja */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav.tabs .wrap{position:relative;display:flex;gap:0 20px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{position:relative;font:500 14.5px var(--f-body);text-decoration:none;white-space:nowrap;color:var(--mut);padding:13px 0 14px;transition:color .2s}
nav.tabs a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--olive);transform:scaleX(0);transform-origin:left center;transition:transform .3s cubic-bezier(.2,.7,.2,1),background-color .2s}
nav.tabs a b{font-weight:inherit}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a:hover::after{transform:scaleX(1)}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs a[aria-current="page"]::after{transform:scaleX(1);background:var(--mahogany)}
nav.tabs a span{font:500 12px var(--f-mono);color:var(--mut);margin-left:6px}

main.wrap{padding-block:20px 40px}

/* liczby */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 18px}
.stat{background:var(--sheet);padding:12px 16px;min-width:0;display:block;color:inherit;text-decoration:none}
a.stat:hover{background:#FFFFFF}
a.stat:hover span{color:var(--ink)}
.stat b{display:block;font:600 34px/1.05 var(--f-display);font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em;margin-bottom:4px}
.stat span{font-size:12.5px;color:var(--mut)}
.stat.is-new b{color:var(--hi)}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:first-child{grid-column:1/-1}}

/* arkusze */
.sheet{background:var(--sheet);border:1px solid var(--line);margin:0 0 18px}
.sheet-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.sheet-h>div{min-width:0}
.sheet-h h2{font:600 24px/1.2 var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sheet-h p{margin:4px 0 0;color:var(--mut);font-size:13.5px;max-width:72ch}
.sheet-b{padding:2px 18px 14px}
.empty{color:var(--mut);padding:14px 0 4px;font-size:14px;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:13.5px;padding:12px 0 4px}
.tools input[type=search]{min-width:0;flex:1 1 240px;font:inherit;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--sheet);color:var(--ink)}
.tools label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
select{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--sheet);color:var(--ink)}

/* wiersze */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:7.4rem minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-top:1px solid var(--line)}
.rows>.row:first-child{border-top:none}
.r-date{font:500 13px/1.4 var(--f-mono);font-variant-numeric:tabular-nums}
.r-date small{display:block;font:400 12px/1.4 var(--f-body);color:var(--mut)}
.r-main{min-width:0}
.r-main a.t{font-weight:500;color:var(--ink);text-decoration-color:var(--line-strong)}
.r-main a.t:hover{color:var(--acc);text-decoration-color:currentColor}
.r-tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.r-meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.r-meta .mono{font-size:12px}
.r-side{text-align:right;font-size:12.5px;color:var(--mut);white-space:nowrap}
.r-side .lbl{margin-bottom:2px}
.r-side b{display:block;font:500 13px/1.35 var(--f-mono);color:var(--ink)}
.month{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin:18px 0 0;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.month:first-child{margin-top:10px}
.row.w{grid-template-columns:minmax(0,1fr) 11rem 6rem 8.5rem 8.5rem}
.row.w .r-col{min-width:0;font-size:13px}
.row.w .r-col b{font:500 13px/1.35 var(--f-mono)}
.row.w .r-col a{display:block;width:fit-content}
.row.w .r-col small{display:block;color:var(--mut);font-size:12px}
@media (max-width:820px){
  .row.w{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row.w .r-main{grid-column:1/-1}
}
@media (max-width:640px){
  .row{grid-template-columns:minmax(0,1fr)}
  .r-side{text-align:left;white-space:normal}
}

/* znaczniki */
.tag{display:inline-flex;align-items:center;font:600 11px/1 var(--f-body);letter-spacing:.02em;padding:4px 7px;border-radius:4px;white-space:nowrap}
.tag.hi{background:var(--hi-soft);color:var(--hi)}
.tag.mid{background:var(--mid-soft);color:var(--mid)}
.tag.lo{background:var(--lo-soft);color:var(--lo)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.kind{background:var(--kind-bg);color:var(--kind-ink)}
.tag.cat{background:transparent;color:var(--moss);box-shadow:inset 0 0 0 1px var(--line-strong)}
.tag.new{background:var(--new);color:var(--new-ink);letter-spacing:.06em}

/* szybkie newsy */
.hot{padding:14px 0 12px;border-bottom:1px solid var(--line)}
.hot h3{font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px;color:var(--ink)}
.hot p{margin:0 0 10px;color:var(--mut);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13.5px var(--f-body);background:var(--sheet);color:var(--ink);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip b{font:500 11px var(--f-mono);color:var(--mut);margin-left:7px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--mahogany);border-color:var(--mahogany);color:#FFFFFF}
.chip[aria-pressed="true"] b{color:var(--linen)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{font:500 13px var(--f-body);background:var(--sheet);color:var(--ink);border:0;border-left:1px solid var(--line-strong);padding:6px 12px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--mahogany);color:#FFFFFF}
.rows.news .r-meta{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.note{color:var(--mut);font-size:12.5px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
/* pytanie dnia */
.quiz{border-left:4px solid var(--olive);background-color:var(--sheet);background-image:linear-gradient(rgba(155,152,121,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(155,152,121,.07) 1px,transparent 1px);background-size:16px 16px}
.quiz-in{padding:18px 20px 14px}
.qz-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
.qz-top .lbl{color:var(--moss);font-weight:600}
.qz-stats{font:500 12px var(--f-mono);color:var(--mut)}
.qz-q{font:600 clamp(18px,2.1vw,22px)/1.35 var(--f-display);margin:8px 0 14px;max-width:72ch;text-wrap:balance;letter-spacing:-.01em}
.qz-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qz-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:500 14.5px/1.4 var(--f-body);background:var(--sheet);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:11px 14px;cursor:pointer;min-width:0;transition:transform .18s cubic-bezier(.2,.7,.2,1),border-color .2s,background-color .2s,box-shadow .2s,opacity .3s}
.qz-opt .k{flex:none;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--linen);color:var(--mahogany);font:600 12.5px var(--f-mono);transition:background-color .2s,color .2s}
.qz-opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--mahogany);box-shadow:0 6px 14px rgba(77,52,45,.12)}
.qz-opt:hover:not(:disabled) .k{background:var(--mahogany);color:#FFFFFF}
.qz-opt:disabled{cursor:default}
.qz-opt.is-ok{background:var(--ok-soft);border-color:var(--ok)}
.qz-opt.is-ok .k{background:var(--ok);color:#FFFFFF}
.qz-opt.is-bad{background:var(--hi-soft);border-color:var(--hi)}
.qz-opt.is-bad .k{background:var(--hi);color:#FFFFFF}
.qz-opt.is-dim{opacity:.5}
.qz-res{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--acc-soft);font-size:14px}
.qz-res b.v{font-weight:700}
.qz-res.ok b.v{color:var(--ok)}
.qz-res.bad b.v{color:var(--hi)}
.qz-res p{margin:6px 0 0;max-width:80ch}
.qz-src{font-size:13px;color:var(--mut)}
.qz-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px;font-size:13px;color:var(--mut)}
.qz-note{margin:12px 0 0;font-size:11.5px;color:var(--mut)}
@keyframes qzPop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
.js-anim .qz-opt.is-ok{animation:qzPop .45s ease}
.js-anim .qz-res{animation:rvIn .4s cubic-bezier(.2,.7,.2,1) both}
@media (max-width:640px){.qz-opts{grid-template-columns:minmax(0,1fr)}}
/* wydarzenia */
#ev-types{padding:4px 0 6px}
.row.ev{grid-template-columns:10.5rem minmax(0,1fr) auto;align-items:start}
.row.ev.is-past{opacity:.65}
.tag.tbc{background:transparent;color:var(--hi);box-shadow:inset 0 0 0 1px var(--hi)}
.btn-ghost{font:600 12.5px var(--f-body);background:transparent;color:var(--ink);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;transition:background-color .2s,border-color .2s,transform .15s}
.btn-ghost:hover{background:var(--linen);border-color:var(--mahogany)}
.btn-ghost:active{transform:scale(.96)}
.ev-media-h{margin-top:28px!important}
.ev-media-sub{margin:6px 0 0;padding-top:0;border-top:0}
@media (max-width:640px){.row.ev{grid-template-columns:minmax(0,1fr)}}
/* normy */
#n-cats{padding:4px 0 6px}
#n-info{margin:8px 0 0;padding-top:0;border-top:0}
.row.nrm{grid-template-columns:14rem minmax(0,1fr) auto;align-items:baseline}
.r-num b{display:block;font:500 13px/1.4 var(--f-mono);color:var(--ink)}
.r-num small{display:block;font:400 12px/1.4 var(--f-mono);color:var(--mut)}
.row.nrm .t{font-weight:500}
.row.nrm .r-side a{font-size:13px;white-space:nowrap}
@media (max-width:640px){.row.nrm{grid-template-columns:minmax(0,1fr)}}
details summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:14px;padding:12px 0 4px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:14px 0 4px}
.links a{display:block;border:1px solid var(--line);padding:12px 14px;text-decoration:none;min-width:0;background:var(--sheet)}
.links a:hover{border-color:var(--line-strong)}
.links b{color:var(--ink);font-weight:600}
.links span{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.alert{border:1px solid var(--hi);background:var(--hi-soft);padding:12px 16px;margin:0 0 18px;font-size:14px}
.alert b{color:var(--hi)}
.alert ul{margin:6px 0 0;padding-left:18px}
footer{color:var(--mut);font-size:12.5px;padding-block:0 32px}
footer p{margin:0 0 6px;max-width:90ch}
/* ===== zdjęcia w sekcjach ===== */
.banner{position:relative;margin:0;height:clamp(150px,22vw,250px);overflow:hidden;background:var(--olive);border-bottom:1px solid var(--line)}
.banner img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.07);transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
.banner.in img,html:not(.js-anim) .banner img{transform:scale(1)}
.banner:hover img{transform:scale(1.035)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(47,32,27,.55) 0%,rgba(47,32,27,0) 55%);pointer-events:none}
.banner figcaption{position:absolute;right:10px;bottom:8px;z-index:1;font:400 11px/1.3 var(--f-body);color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.4);max-width:calc(100% - 20px);text-align:right}
.banner figcaption a{color:inherit}

/* ===== animacje przy najechaniu ===== */
.btn{transition:transform .15s,filter .2s,box-shadow .2s}
.btn:hover{box-shadow:0 6px 14px rgba(47,32,27,.25)}
.btn:active{transform:scale(.96)}
.lang button{transition:background-color .2s,color .2s}
.lang button:hover:not([aria-pressed="true"]){background:rgba(255,255,255,.15)}
.chip{transition:transform .18s cubic-bezier(.2,.7,.2,1),background-color .2s,border-color .2s,box-shadow .2s,color .2s}
.chip:hover{transform:translateY(-2px);background:var(--linen);border-color:var(--mahogany);box-shadow:0 5px 12px rgba(77,52,45,.14)}
.chip[aria-pressed="true"]:hover{background:var(--mahogany);color:#FFFFFF}
.chip:active{transform:translateY(0) scale(.97)}
.seg button{transition:background-color .2s,color .2s}
.seg button:hover:not([aria-pressed="true"]){background:var(--linen)}
.stat{position:relative;transition:transform .22s cubic-bezier(.2,.7,.2,1),box-shadow .22s,background-color .2s}
a.stat:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(77,52,45,.14);z-index:1}
a.stat:hover b{color:var(--mahogany)}
.rows>.row{margin:0 -10px;padding-left:10px;padding-right:10px;border-radius:4px;transition:background-color .2s,box-shadow .2s}
.rows>.row:hover{background:rgba(155,152,121,.12);box-shadow:inset 3px 0 0 var(--mahogany)}
.r-main a.t{transition:color .2s,text-decoration-color .2s}
.links a{transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s,border-color .2s}
.links a:hover{transform:translateY(-3px);border-color:var(--mahogany);box-shadow:0 8px 18px rgba(77,52,45,.12)}
.month{transition:color .2s}

/* ===== pojawianie się przy przewijaniu (tylko gdy działa JS; bez JS wszystko jest widoczne) ===== */
@keyframes rvIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tbIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
.js-anim .rv{opacity:0}
.js-anim .rv.in{animation:rvIn .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0ms)}
.js-anim .sheet.enter{animation:sheetIn .4s cubic-bezier(.2,.7,.2,1) both}
.js-anim .tb-grid{animation:tbIn .6s cubic-bezier(.2,.7,.2,1) both}
.js-anim .tb .status{animation:tbIn .6s .15s cubic-bezier(.2,.7,.2,1) both}

const EN_TYPE = { 'Ustawa': 'Act', 'Rozporządzenie': 'Regulation', 'Obwieszczenie': 'Announcement', 'Uchwała': 'Resolution', 'Zarządzenie': 'Order', 'Umowa międzynarodowa': 'International agreement' };

/* ============ NARZĘDZIA ============ */
const API = 'https://api.sejm.gov.pl';
const LS_STATE = 'prawo-planu:stan:v1';
const LS_WIN = 'prawo-planu:okres';
const LS_LANG = 'prawo-planu:jezyk';
const TABS = ['nowosci', 'newsy', 'wydarzenia', 'kalendarz', 'obserwowane', 'sejm', 'dziennik', 'normy', 'zrodla'];
const STAT_TABS = ['nowosci', 'nowosci', 'kalendarz', 'sejm', 'obserwowane'];
const REF_TYPES = {
  'Akty zmieniające': 'amend',
  'Akty wykonawcze': 'exec',
  'Inf. o tekście jednolitym': 'consolidated',
  'Akty uchylające': 'repeal',
  'Uchylenia wynikające z': 'repeal'
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const short = s => (s ? String(s).slice(0, 10) : '');
const fill = (s, n) => String(s).replace('{n}', n);
let TODAY = ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const dayNum = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5 : null; };
const daysFromToday = s => { const a = dayNum(s); return a == null ? null : a - dayNum(TODAY); };
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? `${m[3]}.${m[2]}.${m[1]}` : ''; };

let lang = 'pl';
let T = I18N.pl;
const fmtDateTime = ts => new Date(ts).toLocaleString(T.locale, { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const nameOf = w => w[lang] || w.pl;
const statusText = s => (lang === 'en' && EN_STATUS[s]) || s;
const typeText = s => (lang === 'en' && EN_TYPE[s]) || s;

function daysLabel(s) {
  const d = daysFromToday(s);
  if (d == null) return '';
  if (d === 0) return T.today;
  if (d === 1) return T.tomorrow;
  if (d === -1) return T.yesterday;
  return d > 0 ? fill(T.inDays, d) : fill(T.daysAgo, -d);
}
// Link główny: oficjalna strona Dziennika Ustaw / Monitora Polskiego – szybka i działa dla każdego rocznika.
function actUrl(eli) {
  const p = String(eli || '').split('/');
  if (p.length < 3) return 'https://dziennikustaw.gov.pl/';
  return p[0] === 'MP' ? `https://monitorpolski.gov.pl/MP/${p[1]}/${p[2]}` : `https://dziennikustaw.gov.pl/DU/${p[1]}/${p[2]}`;
}
// ISAP (tekst ujednolicony, historia zmian). Adres bierzemy z API; przed 2012 r. zawiera numer dziennika,
// więc bez adresu z API budujemy link tylko dla aktów od 2012 r.
function isapUrl(address, eli) {
  let id = address || '';
  if (!id && eli) {
    const p = String(eli).split('/');
    if (p.length === 3 && +p[1] >= 2012) id = (p[0] === 'MP' ? 'WMP' : 'WDU') + p[1] + String(p[2]).padStart(7, '0');
  }
  return id ? 'https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=' + id : '';
}
const isapLink = (address, eli) => {
  const u = isapUrl(address, eli);
  return u ? ` · <a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(T.isapHint)}">ISAP</a>` : '';
};
const eliNum = eli => { const p = String(eli || '').split('/'); return p.length === 3 ? (+p[1]) * 100000 + (+p[2]) : 0; };
function displayAddr(eli) {
  const p = String(eli || '').split('/');
  return p.length < 3 ? String(eli || '') : `${p[0] === 'MP' ? 'M.P.' : 'Dz.U.'} ${p[1]} poz. ${p[2]}`;
}
function priority(title) {
  for (const r of CONFIG.high) if (r.test(title)) return 'wysoki';
  for (const r of CONFIG.low) if (r.test(title)) return 'niski';
  return 'sredni';
}
const tagPrio = p => `<span class="tag ${p === 'wysoki' ? 'hi' : p === 'niski' ? 'lo' : 'mid'}">${esc(T.prio[p] || T.prio.sredni)}</span>`;
const tagKind = k => `<span class="tag kind">${esc(k)}</span>`;

/* ============ KATEGORIE AKTÓW ============ */
// Kolejność = priorytet: akt o zabytkach trafia do „Zabytki”, a nie do ogólnej kategorii budowlanej.
const CATS = [
  { id: 'zabytki',        re: /zabyt|konserwator|dziedzictw|pomnik\p{L}* historii|krajobraz\p{L}* kulturow/iu, kw: ['zabytki', 'wojewódzcy konserwatorzy zabytków'] },
  { id: 'planowanie',     re: /zagospodarowani\p{L}* przestrzenn|planowani\p{L}* przestrzenn|plan\p{L}* ogóln|plan\p{L}* miejscow|warunk\p{L}* zabudowy|urbanist|rewitalizacj|lokalizacji inwestycji|ład\p{L}* przestrzenn/iu, kw: ['planowanie przestrzenne', 'urbanistyka i architektura'] },
  { id: 'ppoz',           re: /przeciwpożar|pożar|ewakuac/iu, kw: ['przeciwpożarowa ochrona'] },
  { id: 'dostepnosc',     re: /dostępności|niepełnospraw|szczególnymi potrzebami/iu, kw: [] },
  { id: 'energia',        re: /energetyczn|energi|odnawialn|ciepłownic|klimat|emisj|fotowolta|pomp\p{L}* ciepła/iu, kw: ['energetyka', 'odnawialne źródła energii', 'energetyczne prawo'] },
  { id: 'mieszkalnictwo', re: /mieszka|deweloper|spółdzielni/iu, kw: ['budownictwo mieszkaniowe', 'spółdzielczość mieszkaniowa'] },
  { id: 'wyroby',         re: /wyrob\p{L}* budowlan|materiał\p{L}* budowlan/iu, kw: ['budowlane materiały'] },
  { id: 'zawod',          re: /samorząd\p{L}* zawodow|uprawnie\p{L}* budowlan|architektów|inżynierów budownictwa/iu, kw: [] },
  { id: 'zamowienia',     re: /zamówie\p{L}* publiczn|zamówienia na roboty|wykonawc/iu, kw: [] },
  { id: 'budowlane',      re: /Prawo budowlane|budowl|budynk|budow|obiekt\p{L}* budowlan/iu, kw: ['budowlane prawo', 'budownictwo', 'roboty budowlane', 'nadzór techniczno-budowlany'] }
];
const CAT_ORDER = ['budowlane', 'planowanie', 'zabytki', 'ppoz', 'dostepnosc', 'energia', 'mieszkalnictwo', 'wyroby', 'zawod', 'zamowienia', 'inne'];
function categorize(text, keywords) {
  const out = CATS.filter(c => c.re.test(text || '') || (keywords || []).some(k => c.kw.includes(k))).map(c => c.id);
  return out.length ? out : ['inne'];
}
const tagCat = id => id ? `<span class="tag cat">${esc((T.cats && T.cats[id]) || id)}</span>` : '';
const tagNew = on => on ? `<span class="tag new">${esc(T.isNew)}</span>` : '';
function tagStatus(s) {
  if (!s) return '';
  let cls = 'mid';
  if (/uchyl|wygaś|zamknięty/i.test(s)) cls = 'hi';
  else if (/obowiązujący|tekst jednolity|uchwalony/i.test(s)) cls = 'ok';
  return `<span class="tag ${cls}">${esc(statusText(s))}</span>`;
}
function loadState() { try { return JSON.parse(localStorage.getItem(LS_STATE)) || {}; } catch (e) { return {}; } }
function saveState(s) { try { localStorage.setItem(LS_STATE, JSON.stringify(s)); } catch (e) { /* brak pamięci przeglądarki */ } }

/* ============ JĘZYK ============ */
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'pl' || q === 'en') return q;
  try { const s = localStorage.getItem(LS_LANG); if (s === 'pl' || s === 'en') return s; } catch (e) { /* ignoruj */ }
  return /^pl\b/i.test(navigator.language || 'pl') ? 'pl' : 'en';
}
function getKey(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
function applyStatic() {
  document.documentElement.lang = lang;
  document.title = T.appName;
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = getKey(T, el.dataset.i18n); if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = getKey(T, el.dataset.i18nPh) || ''; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.querySelectorAll('#win option').forEach(o => { o.textContent = fill(T.daysOpt, o.value); });
  $('#links').innerHTML = CONFIG.links.map(l => { const [n, d] = l[lang] || l.pl; return `<a href="${esc(l.url)}" target="_blank" rel="noopener"><b>${esc(n)}</b><span>${esc(d)}</span></a>`; }).join('');
  $('#sejm-sub').textContent = T.sejmSub.replace('{term}', model && model.term ? fill(T.sejmTerm, model.term) : '');
  if (!model) {
    $('#stats').innerHTML = T.stats.map((l, i) => `<a class="stat" href="#${STAT_TABS[i]}"><b>–</b><span>${esc(fill(l, currentWindow()))}</span></a>`).join('');
    $('#lastvisit').textContent = '—';
  }
  renderBanners();
}
function setLang(l) {
  lang = l; T = I18N[l];
  try { localStorage.setItem(LS_LANG, l); } catch (e) { /* ignoruj */ }
  applyStatic();
  if (model) render(); else if (loadingNow) progress();
  renderNews();
  renderEvents();
  renderNorms();
  renderQuiz();
}

/* ============ POBIERANIE ============ */
let reqDone = 0, reqTotal = 0, loadingNow = false;
const queue = []; let active = 0; const LIMIT = 6;
function progress() {
  $('#bar').style.width = (reqTotal ? Math.round(100 * reqDone / reqTotal) : 0) + '%';
  $('#status-text').textContent = `${T.loading} ${reqDone}/${reqTotal}`;
}
function limited(fn) { return new Promise((res, rej) => { queue.push({ fn, res, rej }); pump(); }); }
function pump() {
  while (active < LIMIT && queue.length) {
    const { fn, res, rej } = queue.shift();
    active++;
    fn().then(res, rej).finally(() => { active--; pump(); });
  }
}
async function getJson(path) {
  reqTotal++; progress();
  try {
    return await limited(async () => {
      for (let i = 0; ; i++) {
        try {
          const r = await fetch(API + path);
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return await r.json();
        } catch (e) {
          if (i >= 2) throw e;
          await new Promise(ok => setTimeout(ok, 700 * (i + 1)));
        }
      }
    });
  } finally { reqDone++; progress(); }
}

async function fetchActs(errors) {
  const dateFrom = addDays(-CONFIG.lookbackDays);
  const acts = new Map();
  const queries = [
    ...CONFIG.keywords.map(k => 'keyword=' + encodeURIComponent(k)),
    ...CONFIG.titlePhrases.map(t => 'title=' + encodeURIComponent(t))
  ];
  await Promise.all(queries.map(async q => {
    try {
      let offset = 0, total = Infinity;
      while (offset < total && offset < 2000) {
        const r = await getJson(`/eli/acts/search?publisher=DU&dateFrom=${dateFrom}&limit=500&offset=${offset}&${q}`);
        const items = (r.items || []).filter(Boolean);
        for (const it of items) if (it.ELI) acts.set(it.ELI, it);
        total = r.totalCount != null ? r.totalCount : (r.count != null ? r.count : items.length);
        if (!items.length) break;
        offset += items.length;
      }
    } catch (e) { errors.push({ k: 'errSearch', d: decodeURIComponent(q.split('=')[1]), m: e.message }); }
  }));
  return [...acts.values()].map(it => ({
    eli: it.ELI,
    title: it.title || it.ELI,
    display: it.displayAddress || displayAddr(it.ELI),
    address: it.address || '',
    type: it.type || '',
    status: it.status || '',
    promulgation: short(it.promulgation),
    entry: short(it.entryIntoForce),
    prio: priority(it.title || ''),
    cats: categorize(it.title, it.keywords)
  }));
}

async function fetchWatched(errors) {
  return Promise.all(CONFIG.watched.map(async w => {
    const out = { ...w, title: '', status: '', refs: [], ok: false };
    try {
      const a = await getJson('/eli/acts/' + w.eli);
      out.ok = true; out.title = a.title || ''; out.status = a.status || ''; out.address = a.address || '';
      const R = a.references || {};
      for (const [type, kind] of Object.entries(REF_TYPES)) {
        for (const r of (R[type] || [])) {
          if (r && r.id) out.refs.push({ type, kind, id: r.id, date: short(r.date), key: `ref|${w.eli}|${type}|${r.id}` });
        }
      }
    } catch (e) { errors.push({ k: 'errWatch', d: w.pl, m: e.message }); }
    const am = out.refs.filter(r => r.kind === 'amend');
    out.amendCount = am.length;
    out.past = am.filter(r => { const d = daysFromToday(r.date); return d != null && d <= 0; }).sort((a, b) => b.date.localeCompare(a.date));
    out.future = am.filter(r => { const d = daysFromToday(r.date); return d != null && d > 0; }).sort((a, b) => a.date.localeCompare(b.date));
    return out;
  }));
}

async function fetchSejm(errors) {
  let term = null;
  try {
    const terms = await getJson('/sejm/term');
    const cur = terms.find(t => t.current) || terms[terms.length - 1];
    term = cur && cur.num;
  } catch (e) { errors.push({ k: 'errTerm', d: '', m: e.message }); return { term: null, list: [] }; }
  const out = new Map();
  await Promise.all(CONFIG.sejmPhrases.map(async ph => {
    try {
      const list = await getJson(`/sejm/term${term}/processes?title=${encodeURIComponent(ph)}`);
      for (const p of (list || [])) {
        if (!p || !p.number) continue;
        if (p.documentType && !/projekt ustawy/i.test(p.documentType)) continue;
        const key = `${term}-${p.number}`;
        if (out.has(key)) continue;
        out.set(key, {
          key, number: String(p.number), title: p.title || '', desc: p.description || '',
          start: short(p.processStartDate), change: p.changeDate || '',
          status: p.passed ? 'uchwalony' : (p.closureDate ? 'zamknięty' : 'w toku'),
          cats: categorize((p.title || '') + ' ' + (p.description || '')),
          eli: p.ELI || '', url: `https://www.sejm.gov.pl/Sejm${term}.nsf/PrzebiegProc.xsp?nr=${p.number}`
        });
      }
    } catch (e) { errors.push({ k: 'errSejm', d: ph, m: e.message }); }
  }));
  return { term, list: [...out.values()] };
}

/* ============ GŁÓWNY PRZEBIEG ============ */
let model = null;

async function run() {
  const btn = $('#refresh');
  btn.disabled = true;
  loadingNow = true;
  TODAY = ymd(new Date());
  reqDone = 0; reqTotal = 0;
  $('#barwrap').hidden = false;
  progress();
  const t0 = performance.now();
  const st = loadState();
  const prevVisit = st.lastVisit || null;

  const errors = [];
  const [acts, watched, sejm] = await Promise.all([fetchActs(errors), fetchWatched(errors), fetchSejm(errors)]);

  // „NOWE” – porównanie z tym, co ta przeglądarka widziała wcześniej
  const firstVisit = !st.seen;
  const seen = st.seen || {};
  const now = Date.now();
  const present = new Set();
  const isNew = key => {
    present.add(key);
    if (!(key in seen)) seen[key] = firstVisit ? 0 : now;
    return seen[key] > 0 && (now - seen[key]) < CONFIG.newBadgeDays * 864e5;
  };
  acts.forEach(a => { a.isNew = isNew('akt|' + a.eli); });
  watched.forEach(w => w.refs.forEach(r => { r.isNew = isNew(r.key); }));
  sejm.list.forEach(p => { p.isNew = isNew(`pr|${p.key}|${p.change}`); });

  // tytuły aktów zmieniających (z pamięci podręcznej albo z API)
  const titles = Object.assign({}, st.titles || {});
  acts.forEach(a => { titles[a.eli] = { t: a.title, d: a.display, a: a.address }; });
  const need = new Set();
  watched.forEach(w => w.refs.forEach(r => {
    const d = daysFromToday(r.date);
    if (r.isNew || (d != null && d >= -90 && d <= CONFIG.calendarDays)) need.add(r.id);
  }));
  await Promise.all([...need].filter(id => !titles[id]).map(async id => {
    try { const a = await getJson('/eli/acts/' + id); titles[id] = { t: a.title || id, d: a.displayAddress || displayAddr(id), a: a.address || '' }; }
    catch (e) { /* bez tytułu pokażemy sam numer */ }
  }));

  // zapis stanu tej przeglądarki
  if (!errors.length) for (const k of Object.keys(seen)) if (!present.has(k)) delete seen[k];
  const keepTitles = {};
  need.forEach(id => { if (titles[id]) keepTitles[id] = titles[id]; });
  saveState({ seen, titles: keepTitles, lastVisit: now });

  model = { acts, watched, procs: sejm.list, term: sejm.term, titles, errors, at: now, prevVisit, firstVisit,
            requests: reqTotal, ms: Math.round(performance.now() - t0) };
  loadingNow = false;
  applyStatic();
  render();
  btn.disabled = false;
}

/* ============ RENDEROWANIE ============ */
function rowHtml({ date, sub, tags, title, url, meta, side, attrs }) {
  return `<li class="row"${attrs || ''}>` +
    `<div class="r-date">${esc(fmtDate(date) || '—')}${sub ? `<small>${esc(sub)}</small>` : ''}</div>` +
    `<div class="r-main">${tags ? `<div class="r-tags">${tags}</div>` : ''}` +
    `<a class="t" href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a>` +
    `${meta ? `<div class="r-meta">${meta}</div>` : ''}</div>` +
    `${side ? `<div class="r-side">${side}</div>` : ''}</li>`;
}

function currentWindow() { return parseInt($('#win').value, 10) || 30; }

function refLabel(r) {
  if (r.kind !== 'amend') return T.kinds[r.kind] || r.kind;
  const d = daysFromToday(r.date);
  return (d != null && d > 0) ? T.kinds.planned : T.kinds.inForce;
}

function buildNews(m, win) {
  const out = [];
  for (const a of m.acts) {
    if (a.prio === 'niski' && !a.isNew) continue;
    const d = daysFromToday(a.promulgation);
    if (!(a.isNew || (d != null && d >= -win && d <= 0))) continue;
    out.push({
      date: a.promulgation, isNew: a.isNew,
      tags: tagNew(a.isNew) + tagKind(`${T.lbl.dzu} · ${typeText(a.type)}`) + tagPrio(a.prio) + tagCat(a.cats[0]),
      title: a.title, url: actUrl(a.eli),
      meta: `<span class="mono">${esc(a.display)}</span>${isapLink(a.address, a.eli)}`,
      side: a.entry ? `<span class="lbl">${esc(T.lbl.entry)}</span><b>${esc(fmtDate(a.entry))}</b>${esc(daysLabel(a.entry))}` : ''
    });
  }
  for (const w of m.watched) for (const r of w.refs) {
    const d = daysFromToday(r.date);
    const inWin = d != null && d >= -win && d <= 0;
    if (!(r.isNew || inWin)) continue;
    const t = m.titles[r.id];
    out.push({
      date: r.date, isNew: r.isNew,
      tags: tagNew(r.isNew) + tagKind(refLabel(r)) + tagPrio('wysoki') + tagCat(w.cat),
      title: `${nameOf(w)}: ${t ? t.t : displayAddr(r.id)}`, url: actUrl(r.id),
      meta: `<span class="mono">${esc(t ? t.d : displayAddr(r.id))}</span>${isapLink(t && t.a, r.id)}`,
      side: ''
    });
  }
  for (const p of m.procs) {
    const d = daysFromToday(p.change);
    if (!(p.isNew || (d != null && d >= -win))) continue;
    out.push({
      date: short(p.change), isNew: p.isNew,
      tags: tagNew(p.isNew) + tagKind(`${T.lbl.sejm} · ${statusText(p.status)}`),
      title: p.title, url: p.url,
      meta: `${esc(T.lbl.print)} <span class="mono">${esc(p.number)}</span>${p.desc ? ' · ' + esc(p.desc) : ''}`,
      side: ''
    });
  }
  out.sort((a, b) => (b.isNew - a.isNew) || String(b.date).localeCompare(String(a.date)));
  return out;
}

function buildCalendar(m) {
  const map = new Map();
  for (const a of m.acts) {
    if (a.prio === 'niski') continue;
    const d = daysFromToday(a.entry);
    if (d != null && d >= 0 && d <= CONFIG.calendarDays) {
      map.set(a.eli + '|' + a.entry, { date: a.entry, title: a.title, url: actUrl(a.eli), src: T.lbl.journal, prio: a.prio, meta: a.display, cat: a.cats[0] });
    }
  }
  for (const w of m.watched) for (const r of w.future) {
    const d = daysFromToday(r.date);
    if (d == null || d > CONFIG.calendarDays) continue;
    const t = m.titles[r.id];
    const key = r.id + '|' + r.date;
    const prev = map.get(key);
    const names = prev && prev.watchNames ? prev.watchNames.concat(nameOf(w)) : [nameOf(w)];
    map.set(key, {
      date: r.date, title: t ? t.t : displayAddr(r.id), url: actUrl(r.id), prio: 'wysoki',
      src: `${T.lbl.amends}: ${names.join(', ')}`, watchNames: names, meta: t ? t.d : displayAddr(r.id), cat: w.cat
    });
  }
  for (const t of CONFIG.terms) {
    const d = daysFromToday(t.date);
    if (d != null && d >= 0) map.set('T|' + t.date + t.pl, { date: t.date, title: t[lang] || t.pl, url: t.url, src: (lang === 'en' ? 'EU' : 'UE') + ' – EPBD 2024/1275', prio: 'sredni', meta: '', cat: 'energia' });
  }
  return [...map.values()].sort((a, b) => a.date.localeCompare(b.date));
}

        date: a.promulgation, sub: T.lbl.promulgated,
        tags: tagNew(a.isNew) + tagPrio(a.prio) + tagStatus(a.status) + a.cats.slice(0, 2).map(tagCat).join(''),
        title: a.title, url: actUrl(a.eli), meta: `<span class="mono">${esc(a.display)}</span>${a.type ? ' · ' + esc(typeText(a.type)) : ''}${isapLink(a.address, a.eli)}`,
        side: a.entry ? `<span class="lbl">${esc(T.lbl.inForceFrom)}</span><b>${esc(fmtDate(a.entry))}</b>` : '',
        attrs: ` data-p="${esc(a.prio)}" data-cats=" ${esc(a.cats.join(' '))} "`

let duCat = '';
function filterDu() {
  const q = $('#q').value.trim().toLowerCase();
  const low = $('#low').checked;
  let shown = 0;
  document.querySelectorAll('#du-list > .row').forEach(r => {
    const ok = (!q || r.textContent.toLowerCase().includes(q)) &&
               (low || r.dataset.p !== 'niski' || duCat) &&
               (!duCat || (r.dataset.cats || '').includes(' ' + duCat + ' '));
    r.hidden = !ok;
    if (ok) shown++;

  document.querySelectorAll('#du-cats .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === duCat)));
  const none = $('#du-none');
  if (none) none.hidden = shown > 0;
}

// news.json przygotowuje automat GitHub Actions (scripts/newsy.ps1) co 3 godziny.
const NEWS_STOP = new Set((
  'the a an and or of to in on for with at by from as is are was were be been being it its this that these those how why what who whom which ' +
  'new into over after before about than more most up out not no but you your we our their they them he she his her has have had will can could ' +
  'would should may might just also all any some one two three four five first last year years day days week weeks news says said report reports ' +
  'video photos photo via vs amid make makes made get gets inside look looks here there now today set sets take takes plans unveils unveiled ' +
  'opens open opened launch launches reveals revealed completes completed features featuring around across between under during through ' +
  'announces announced announce wins win won approved approves begins start starts end ends ahead behind against without within among next latest ' +
  'top best big million billion part ways way still back off why who ' +
  'architecture architectural architect architects design designed designs designer designers building buildings build builds built construction ' +
  'house houses home homes project projects studio studios office offices world first-ever ' +
  'i w we z ze na do o od po za przez dla jak co to ten ta te tym tej tego jest są był była było być się nie tak czy oraz a ale lub już też jako przy ' +
  'pod nad między który która które których którzy roku rok lat nowy nowa nowe nowych nowego dziś teraz będzie może można jego jej ich ma mają czyli ' +
  'tylko bardzo architektura architektury architekt architekci architektów budownictwo budownictwa budowa budowy budynek budynki budynków budynku ' +
  'projekt projektu dom domy domu inwestycja inwestycji polsce polska polski polskie koniec końca początek sprawie kolejny kolejne czas ponad ' +
  'około mln mld proc wraz trzeba jakie jaki gdzie kiedy dlaczego sposób będą został została zostały mamy oni ona ono one nas nam ' +
  'city cities town red window'
).split(/\s+/));
let NEWS = null;
const newsState = { region: 'all', range: 1, term: '' };

function relTime(ts) {
  const m = Math.round((Date.now() - ts) / 6e4);
  if (m < 1) return T.justNow;
  if (m < 60) return fill(T.minAgo, m);
  const h = Math.floor(m / 60);
  if (h < 24) return fill(T.hAgo, h);
  const d = Math.floor(h / 24);
  return d === 1 ? T.yesterday : fill(T.daysAgo, d);
}
// Zwraca słowa i dwuwyrazowe frazy z tytułu oraz te, które wyglądają na nazwy własne
// (wielka litera w środku zdania albo skrótowiec). Tytuły pisane Wielkimi Literami (styl angielski) nie liczą się jako nazwy własne.
function newsTerms(title) {
  const words = (String(title).match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || []).map(t => t.replace(/['’]s$/, ''));
  const titleCase = words.filter(w => /^\p{Lu}/u.test(w)).length / Math.max(1, words.length) > 0.6;
  const tk = words.map(w => w.toLowerCase());
  const ok = t => t.length >= 3 && !NEWS_STOP.has(t) && !/^[\d-]+$/.test(t);
  const terms = new Set(), proper = new Set();
  tk.forEach((t, i) => {
    if (!ok(t)) return;
    terms.add(t);
    const w = words[i];
    if ((/^\p{Lu}{3,}$/u.test(w)) || (i > 0 && !titleCase && /^\p{Lu}/u.test(w))) proper.add(t);
    if (i + 1 < tk.length && ok(tk[i + 1])) terms.add(t + ' ' + tk[i + 1]);
  });
  return { terms, proper };
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function hotTopics(items) {
  const map = new Map();
  for (const it of items) for (const k of it.terms) {
    let e = map.get(k);
    if (!e) map.set(k, e = { key: k, outlets: new Set(), n: 0, proper: 0, sample: it.title });
    e.outlets.add(it.outlet.toLowerCase()); e.n++;
    if (it.proper.has(k)) e.proper++;
  }
  // fraza: min. 2 redakcje; nazwa własna: min. 2 redakcje; zwykłe słowo: min. 3 redakcje
  const isPhrase = e => e.key.includes(' ');
  const cand = [...map.values()].filter(e => isPhrase(e) ? e.outlets.size >= 2 : (e.outlets.size >= 3 || (e.outlets.size >= 2 && e.proper >= 2 && e.key.length >= 4)));
  const score = e => e.outlets.size + (isPhrase(e) ? 1 : 0) + (e.proper > 0 ? 0.5 : 0);
  cand.sort((a, b) => (score(b) - score(a)) || (b.n - a.n));
  const picked = [];
  for (const e of cand) {
    if (picked.length >= 8) break;
    const words = e.key.split(' ');
    // bez powtórzeń tego samego słowa ani jego odmiany (deweloper / deweloperzy)
    const same = (a, b) => a === b || (a.length >= 6 && b.length >= 6 && a.slice(0, 6) === b.slice(0, 6));
    if (picked.some(p => p.key.split(' ').some(w => words.some(x => same(w, x))))) continue;
    picked.push(e);
  }
  return picked.map(e => {
    const m = e.sample.match(new RegExp(e.key.split(' ').map(escRe).join("['’]?s?[\\s-]+"), 'iu'));
    return { key: e.key, outlets: e.outlets.size, label: m ? m[0] : e.key };
  });
}

async function loadNews() {
  try {
    const r = await fetch('news.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    data.items = (data.items || []).map(it => Object.assign({}, it, { ts: Date.parse(it.date) }, newsTerms(it.title))).filter(it => !isNaN(it.ts));
    // ten sam artykuł bywa i w kanale redakcji, i w Google News – zostaw jeden (ten z zajawką)
    const byTitle = new Map();
    data.items = data.items.filter(it => {
      const k = it.title.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
      const prev = byTitle.get(k);
      if (!prev) { byTitle.set(k, it); return true; }
      if (!prev.summary && it.summary) Object.assign(prev, it);
      return false;
    });
    NEWS = data;
  } catch (e) { NEWS = { error: e.message, items: [], sources: [] }; }
  renderNews();
  renderEvents();
}

function renderNews() {
  const box = $('#quick');
  const seg = (id, opts, cur) => { $(id).innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(cur) === String(v)}">${esc(l)}</button>`).join(''); };
  seg('#q-region', [['all', T.qAll], ['swiat', T.qWorld], ['polska', T.qPoland]], newsState.region);
  seg('#q-range', [[1, T.q24], [3, T.q3], [7, T.q7]], newsState.range);
  if (!NEWS) { $('#quick-sub').textContent = T.quickSub; box.innerHTML = `<p class="empty">${esc(T.loadingShort)}</p>`; return; }
  if (NEWS.error) {
    $('#quick-sub').textContent = T.quickSub; $('#hot').innerHTML = ''; $('#n-quick').textContent = '';
    box.innerHTML = `<p class="empty">${esc(T.newsMissing)}</p>`;
    return;
  }
  const now = Date.now();
  const okSources = (NEWS.sources || []).filter(s => s.ok).length;
  $('#quick-sub').textContent = `${T.quickSub} ${fill(T.newsUpdated, relTime(Date.parse(NEWS.generated))).replace('{s}', okSources)}`;

  const newsItems = NEWS.items.filter(it => it.topic !== 'wydarzenia');   // zapowiedzi wydarzeń są w zakładce Wydarzenia
  const byRegion = newsItems.filter(it => newsState.region === 'all' || it.region === newsState.region);
  let hotBase = byRegion.filter(it => now - it.ts < 864e5);
  if (hotBase.length < 8) hotBase = byRegion.filter(it => now - it.ts < 2 * 864e5);
  const hot = hotTopics(hotBase);
  const hotKeys = hot.map(h => h.key);
  if (newsState.term && !hotKeys.includes(newsState.term)) newsState.term = '';
  $('#hot').innerHTML = `<h3>${esc(T.hotTitle)}</h3><p>${esc(T.hotHint)}</p>` + (hot.length
    ? `<div class="chips">${hot.map(h => `<button type="button" class="chip" data-term="${esc(h.key)}" aria-pressed="${newsState.term === h.key}">${esc(h.label)}<b>${h.outlets}</b></button>`).join('')}</div>`
    : `<p class="empty">${esc(T.hotNone)}</p>`);

  const list = byRegion
    .filter(it => now - it.ts < newsState.range * 864e5 && (!newsState.term || it.terms.has(newsState.term)))
    .sort((a, b) => b.ts - a.ts);
  $('#n-quick').textContent = newsItems.filter(it => now - it.ts < 864e5).length;
  box.innerHTML = list.length
    ? `<ul class="rows news">${list.map(it => {
        const isHot = hotKeys.some(k => it.terms.has(k));
        return rowHtml({
          date: it.date, sub: relTime(it.ts),
          tags: tagKind(it.outlet) + `<span class="tag ${it.region === 'polska' ? 'mid' : 'lo'}">${esc(it.region === 'polska' ? T.qPoland : T.qWorld)}</span>` + (isHot ? `<span class="tag hi">${esc(T.hotTag)}</span>` : ''),
          title: it.title, url: it.link,
          meta: it.summary ? esc(it.summary) : (it.via ? esc(T.viaGN) : '')
        });
      }).join('')}</ul>`
    : `<p class="empty">${esc(T.newsEmpty)}</p>`;
  reveal($('#s-newsy'));
}

/* ============ NORMY ============ */
// Kluczowe PN – lista stała (KEY_NORMS); ISO – normy.json z automatu (ISO Open Data).
let NORMS = null;
const normsState = { view: 'pn', cat: '', q: '' };
const pknUrl = num => 'https://sklep.pkn.pl/catalogsearch/result/?q=' + encodeURIComponent(num);
const icsGroup = ics => String(ics).startsWith('93') ? '93' : String(ics).split('.').slice(0, 2).join('.');

async function loadNorms() {
  try {
    const r = await fetch('normy.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    NORMS = await r.json();
    NORMS.iso = (NORMS.iso || []).map(s => Object.assign({}, s, { grp: icsGroup(s.ics) }));
  } catch (e) { NORMS = { error: e.message, iso: [] }; }
  renderNorms();
}

function renderNorms() {
  const isoCount = NORMS && NORMS.iso ? NORMS.iso.length : 0;
  $('#n-view').innerHTML = [['pn', `${T.normsView.pn} (${KEY_NORMS.length})`], ['iso', `${T.normsView.iso}${isoCount ? ` (${isoCount})` : ''}`]]
    .map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${normsState.view === v}">${esc(l)}</button>`).join('');
  $('#n-norms').textContent = KEY_NORMS.length + isoCount;
  const q = normsState.q.trim().toLowerCase();
  const box = $('#norms');
  $('#n-info').hidden = normsState.view !== 'iso';
  $('#n-info').textContent = T.normsIsoInfo;

  if (normsState.view === 'pn') {
    const counts = {};
    KEY_NORMS.forEach(n => { counts[n.cat] = (counts[n.cat] || 0) + 1; });
    $('#n-cats').innerHTML = `<button type="button" class="chip" data-cat="" aria-pressed="${!normsState.cat}">${esc(T.allCats)}<b>${KEY_NORMS.length}</b></button>` +
      NORM_CATS.map(c => `<button type="button" class="chip" data-cat="${c}" aria-pressed="${normsState.cat === c}">${esc(T.normCats[c])}<b>${counts[c] || 0}</b></button>`).join('');
    const match = n => (!normsState.cat || n.cat === normsState.cat) && (!q || `${n.num} ${n.ed || ''} ${n.pl} ${n.en}`.toLowerCase().includes(q));
    const row = n => `<li class="row nrm"><div class="r-num"><b>${esc(n.num)}${n.ed ? ':' + esc(n.ed) : ''}</b>${n.ed ? `<small>${esc(T.edVerified)} ${esc(n.ed)}</small>` : ''}</div>` +
      `<div class="r-main"><span class="t">${esc(n[lang] || n.pl)}</span></div>` +
      `<div class="r-side"><a href="${esc(pknUrl(n.num))}" target="_blank" rel="noopener">${esc(T.checkPKN)} ↗</a></div></li>`;
    const html = NORM_CATS.map(c => {
      const list = KEY_NORMS.filter(n => n.cat === c && match(n));
      return list.length ? `<h3 class="month">${esc(T.normCats[c])}</h3><ul class="rows">${list.map(row).join('')}</ul>` : '';
    }).join('');
    box.innerHTML = html || `<p class="empty">${esc(T.normsNone)}</p>`;
    reveal(box);
    return;
  }

  // widok ISO
  if (!NORMS) { $('#n-cats').innerHTML = ''; box.innerHTML = `<p class="empty">${esc(T.loadingShort)}</p>`; return; }
  if (NORMS.error || !NORMS.iso.length) { $('#n-cats').innerHTML = ''; box.innerHTML = `<p class="empty">${esc(T.normsMissing)}</p>`; return; }
  const counts = {};
  NORMS.iso.forEach(s => { counts[s.grp] = (counts[s.grp] || 0) + 1; });
  const groups = ICS_GROUPS.filter(g => counts[g]);
  if (normsState.cat && !counts[normsState.cat]) normsState.cat = '';
  $('#n-cats').innerHTML = `<button type="button" class="chip" data-cat="" aria-pressed="${!normsState.cat}">${esc(T.allCats)}<b>${NORMS.iso.length}</b></button>` +
    groups.map(g => `<button type="button" class="chip" data-cat="${g}" aria-pressed="${normsState.cat === g}">${esc(T.ics[g] || g)}<b>${counts[g]}</b></button>`).join('');
  const row = s => `<li class="row nrm"><div class="r-num"><b>${esc(s.ref)}</b><small>${esc(s.type)} · ICS ${esc(s.ics)}</small></div>` +
    `<div class="r-main"><a class="t" href="https://www.iso.org/standard/${encodeURIComponent(s.id)}.html" target="_blank" rel="noopener">${esc(s.title)}</a></div>` +
    `<div class="r-side">${esc(fmtDate(s.date))}</div></li>`;
  const html = groups.filter(g => !normsState.cat || g === normsState.cat).map(g => {
    const list = NORMS.iso.filter(s => s.grp === g && (!q || `${s.ref} ${s.title}`.toLowerCase().includes(q)));
    return list.length ? `<h3 class="month">${esc(g === '93' ? '93' : g)} · ${esc(T.ics[g] || g)}</h3><ul class="rows">${list.map(row).join('')}</ul>` : '';
  }).join('');
  box.innerHTML = html || `<p class="empty">${esc(T.normsNone)}</p>`;
  reveal(box);
}

/* ============ PYTANIE DNIA – WIDOK ============ */
const LS_QUIZ = 'prawo-planu:quiz';
function seededRand(seed) {          // mulberry32 – powtarzalne „losowanie”
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hashStr = s => { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
function seededShuffle(arr, seed) {
  const a = arr.slice(), r = seededRand(seed);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Kolejność pytań w kolejnych dniach jest stała (ta sama dla wszystkich odwiedzających),
// a kategorie się przeplatają: prawo, architektura, technika, planowanie…
const QZ_ORDER = (() => {
  const byCat = {};
  seededShuffle(QUIZ.map((_, i) => i), 2026).forEach(i => { (byCat[QUIZ[i].cat] = byCat[QUIZ[i].cat] || []).push(i); });
  // każda kategoria rozłożona równomiernie na cały cykl (pozycja = (k + przesunięcie) / liczba pytań w kategorii)
  const slots = [];
  Object.keys(byCat).sort().forEach((c, ci, all) => {
    const list = byCat[c];
    list.forEach((i, k) => slots.push({ i, key: (k + 0.5 + ci / all.length / 2) / list.length }));
  });
  return slots.sort((a, b) => a.key - b.key).map(s => s.i);
})();
const dayKey = n => new Date(n * 864e5).toISOString().slice(0, 10);
const quizToday = () => QUIZ[QZ_ORDER[((dayNum(TODAY) % QUIZ.length) + QUIZ.length) % QUIZ.length]];
// Poprawna odpowiedź (indeks 0) trafia po równo na A, B, C i D; błędne są tasowane
function optOrder(q) {
  const order = seededShuffle([1, 2, 3], hashStr(q.id));
  order.splice(QUIZ.indexOf(q) % 4, 0, 0);
  return order;
}
function quizLoad() { try { return JSON.parse(localStorage.getItem(LS_QUIZ)) || { d: {} }; } catch (e) { return { d: {} }; } }
function quizSave(s) { try { localStorage.setItem(LS_QUIZ, JSON.stringify(s)); } catch (e) { /* brak pamięci przeglądarki */ } }
const quizState = { practice: null, practiceAnswer: null };

function quizStats(s) {
  const days = Object.keys(s.d || {});
  let streak = 0, cur = dayNum(TODAY);
  if (!s.d[TODAY]) cur -= 1;                     // dziś jeszcze bez odpowiedzi – seria liczona do wczoraj
  while (s.d[dayKey(cur)]) { streak++; cur--; }
  return { total: days.length, good: days.filter(k => s.d[k].ok).length, streak };
}

function renderQuiz() {
  const box = $('#quiz');
  if (!box) return;
  const s = quizLoad();
  const practice = quizState.practice != null;
  const q = practice ? QUIZ[quizState.practice] : quizToday();
  const saved = s.d[TODAY];
  const ans = practice ? quizState.practiceAnswer : (saved && saved.id === q.id ? saved.c : null);
  const tx = x => (x && (x[lang] || x.pl)) || '';
  const order = optOrder(q), letters = 'ABCD', answered = ans != null;

  const opts = order.map((oi, pos) => {
    let cls = 'qz-opt';
    if (answered) cls += oi === 0 ? ' is-ok' : (oi === ans ? ' is-bad' : ' is-dim');
    return `<button type="button" class="${cls}" data-opt="${oi}"${answered ? ' disabled' : ''}><span class="k">${letters[pos]}</span><span>${esc(tx(q.a[oi]))}</span></button>`;
  }).join('');

  let res = '';
  if (answered) {
    const ok = ans === 0;
    const src = q.src && QZ_SRC[q.src[0]]
      ? `<p class="qz-src">${esc(T.qzSource)}: <a href="${esc(QZ_SRC[q.src[0]].url)}" target="_blank" rel="noopener">${esc(tx(QZ_SRC[q.src[0]]))}${q.src[1] ? ', ' + esc(q.src[1]) : ''}</a></p>` : '';
    res = `<div class="qz-res ${ok ? 'ok' : 'bad'}"><b class="v">${esc(ok ? T.qzGood : T.qzBad)}</b> ${esc(fill(T.qzCorrectIs, letters[order.indexOf(0)]))}<p>${esc(tx(q.e))}</p>${src}</div>` +
      `<div class="qz-actions"><button type="button" class="btn-ghost" data-qz="practice">${esc(T.qzPractice)}</button>` +
      (practice ? `<button type="button" class="btn-ghost" data-qz="today">${esc(T.qzBack)}</button>` : `<span>${esc(T.qzNext)}</span>`) + `</div>`;
  }
  const st = quizStats(s);
  const stats = st.total ? `${st.streak === 1 ? T.qzStreak1 : fill(T.qzStreak, st.streak)} · ${T.qzScore.replace('{a}', st.good).replace('{b}', st.total)}` : '';
  const eyebrow = practice ? `${T.qzPracticeLbl} · ${T.qzCats[q.cat]}` : `${T.qzTitle} · ${fmtDate(TODAY)} · ${T.qzCats[q.cat]}`;
  box.innerHTML = `<div class="qz-top"><span class="lbl">${esc(eyebrow)}</span><span class="qz-stats">${esc(stats)}</span></div>` +
    `<p class="qz-q">${esc(tx(q.q))}</p><div class="qz-opts">${opts}</div>${res}<p class="qz-note">${esc(T.qzNote)}</p>`;
}

function quizClick(e) {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.opt != null) {
    const oi = +b.dataset.opt;
    if (quizState.practice != null) quizState.practiceAnswer = oi;
    else {
      const s = quizLoad(), q = quizToday();
      if (!s.d[TODAY]) { s.d[TODAY] = { id: q.id, c: oi, ok: oi === 0 }; quizSave(s); }   // liczy się pierwsza odpowiedź
    }
  } else if (b.dataset.qz === 'practice') {
    const todayIdx = QUIZ.indexOf(quizToday());
    let i;
    do { i = Math.floor(Math.random() * QUIZ.length); } while (QUIZ.length > 2 && (i === todayIdx || i === quizState.practice));
    quizState.practice = i;
    quizState.practiceAnswer = null;
  } else if (b.dataset.qz === 'today') {
    quizState.practice = null;
    quizState.practiceAnswer = null;
  } else return;
  renderQuiz();
}

/* ============ WYDARZENIA – WIDOK ============ */
const evState = { region: 'all', type: '', past: false };
const evName = e => typeof e.name === 'string' ? e.name : (e.name[lang] || e.name.pl);
const evStart = e => e.start || (e.month + '-01');
function evEnd(e) {
  if (e.end) return e.end;
  const [y, m] = e.month.split('-').map(Number);
  return `${y}-${pad(m)}-${pad(new Date(Date.UTC(y, m, 0)).getUTCDate())}`;   // ostatni dzień miesiąca
}
function evDates(e) {
  if (!e.start) { const [y, m] = e.month.split('-'); return `${T.months[+m - 1]} ${y}`; }
  const [ys, ms, ds] = e.start.split('-'), [ye, me, de] = e.end.split('-');
  if (e.start === e.end) return `${ds}.${ms}.${ys}`;
  if (ys === ye && ms === me) return `${ds}–${de}.${me}.${ye}`;
  if (ys === ye) return `${ds}.${ms}–${de}.${me}.${ye}`;
  return `${ds}.${ms}.${ys}–${de}.${me}.${ye}`;
}
function evStatus(e) {
  if (daysFromToday(evEnd(e)) < 0) return 'ended';
  if (daysFromToday(evStart(e)) <= 0) return 'now';
  return 'soon';
}

function evRow(e) {
  const st = evStatus(e);
  const sub = st === 'now' ? T.evNow : st === 'ended' ? T.evEnded : (e.start ? daysLabel(e.start) : T.evTbc);
  const tags = (st === 'now' ? `<span class="tag new">${esc(T.evNow)}</span>` : '') +
    tagKind(T.evType1[e.type]) +
    `<span class="tag ${e.region === 'pl' ? 'mid' : 'lo'}">${esc(e.region === 'pl' ? T.evRegion.pl : T.evRegion.swiat)}</span>` +
    (e.tbc ? `<span class="tag tbc">${esc(T.evTbc)}</span>` : '');
  const ics = (!e.tbc && e.start && st !== 'ended') ? `<button type="button" class="btn-ghost" data-ics="${esc(e.id)}">${esc(T.evIcs)}</button>` : '';
  return `<li class="row ev${st === 'ended' ? ' is-past' : ''}">` +
    `<div class="r-date">${esc(evDates(e))}<small>${esc(sub)}</small></div>` +
    `<div class="r-main"><div class="r-tags">${tags}</div>` +
    `<a class="t" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(evName(e))}</a>` +
    `<div class="r-meta">${esc(e.city[lang] || e.city.pl)} · ${esc(e.desc[lang] || e.desc.pl)}</div></div>` +
    `<div class="r-side">${ics}</div></li>`;
}

function renderEvents() {
  const box = $('#events');
  if (!box) return;
  $('#ev-region').innerHTML = ['all', 'pl', 'swiat'].map(v => `<button type="button" data-v="${v}" aria-pressed="${evState.region === v}">${esc(T.evRegion[v])}</button>`).join('');
  const visible = EVENTS.filter(e => (evState.region === 'all' || e.region === evState.region) && (evState.past || evStatus(e) !== 'ended'));
  const counts = {};
  visible.forEach(e => { counts[e.type] = (counts[e.type] || 0) + 1; });
  $('#ev-types').innerHTML = `<button type="button" class="chip" data-type="" aria-pressed="${!evState.type}">${esc(T.allCats)}<b>${visible.length}</b></button>` +
    EV_TYPES.map(t => `<button type="button" class="chip" data-type="${t}" aria-pressed="${evState.type === t}">${esc(T.evTypes[t])}<b>${counts[t] || 0}</b></button>`).join('');
  $('#n-events').textContent = EVENTS.filter(e => evStatus(e) !== 'ended').length;

  const list = visible.filter(e => !evState.type || e.type === evState.type).sort((a, b) => evStart(a).localeCompare(evStart(b)) || evEnd(a).localeCompare(evEnd(b)));
  if (!list.length) {
    box.innerHTML = `<p class="empty">${esc(T.evNone)}</p>`;
  } else {
    let html = '', month = '';
    for (const e of list) {
      const mo = evStart(e).slice(0, 7);
      if (mo !== month) {
        if (month) html += '</ul>';
        month = mo;
        html += `<h3 class="month">${esc(T.months[+mo.slice(5, 7) - 1])} ${mo.slice(0, 4)}</h3><ul class="rows">`;
      }
      html += evRow(e);
    }
    box.innerHTML = html + '</ul>';
  }

  // zapowiedzi i relacje z mediów (automat, Google News)
  const media = $('#ev-media');
  if (!NEWS) media.innerHTML = `<p class="empty">${esc(T.loadingShort)}</p>`;
  else if (NEWS.error) media.innerHTML = `<p class="empty">${esc(T.newsMissing)}</p>`;
  else {
    const items = NEWS.items
      .filter(it => it.topic === 'wydarzenia' && (evState.region === 'all' || (evState.region === 'pl' ? it.region === 'polska' : it.region === 'swiat')))
      .sort((a, b) => b.ts - a.ts).slice(0, 40);
    media.innerHTML = items.length
      ? `<ul class="rows news">${items.map(it => rowHtml({
          date: it.date, sub: relTime(it.ts),
          tags: tagKind(it.outlet) + `<span class="tag ${it.region === 'polska' ? 'mid' : 'lo'}">${esc(it.region === 'polska' ? T.qPoland : T.qWorld)}</span>`,
          title: it.title, url: it.link, meta: it.summary ? esc(it.summary) : esc(T.viaGN)
        })).join('')}</ul>`
      : `<p class="empty">${esc(T.evMediaNone)}</p>`;
  }
  reveal($('#s-wydarzenia'));
}

// Plik .ics (wydarzenie całodniowe) – działa z Google Calendar, Outlookiem i kalendarzem iPhone’a
function downloadIcs(id) {
  const e = EVENTS.find(x => x.id === id);
  if (!e || !e.start) return;
  const ymdC = s => s.replace(/-/g, '');
  const [y, m, d] = e.end.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d + 1));                 // DTEND jest wyłączny
  const endEx = `${t.getUTCFullYear()}${pad(t.getUTCMonth() + 1)}${pad(t.getUTCDate())}`;
  const escI = s => String(s).replace(/\\/g, '\\\\').replace(/[,;]/g, c => '\\' + c).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Prawo planu//Wydarzenia//PL', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    `UID:${e.id}@prawoplanu`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymdC(e.start)}`, `DTEND;VALUE=DATE:${endEx}`,
    `SUMMARY:${escI(evName(e))}`, `LOCATION:${escI(e.city[lang] || e.city.pl)}`,
    `DESCRIPTION:${escI((e.desc[lang] || e.desc.pl) + '\n' + e.url)}`, `URL:${e.url}`, 'END:VEVENT', 'END:VCALENDAR'];
  const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/calendar;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${e.id}.ics`;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ============ ZDJĘCIA I ANIMACJE ============ */
// Animacje włączają się tylko, gdy przeglądarka je obsługuje i użytkownik nie wybrał „ogranicz ruch”.
const MOTION = 'IntersectionObserver' in window && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
if (MOTION) document.documentElement.classList.add('js-anim');
const revealIO = MOTION ? new IntersectionObserver(entries => {
  let n = 0;
  entries.filter(e => e.isIntersecting)
    .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)
    .forEach(e => {
      e.target.style.setProperty('--d', Math.min(n++, 6) * 40 + 'ms');   // kolejne elementy wjeżdżają po sobie
      e.target.classList.add('in');
      revealIO.unobserve(e.target);
    });
}, { rootMargin: '0px 0px -30px 0px', threshold: 0.05 }) : null;
function reveal(root) {
  if (!revealIO || !root) return;
  root.querySelectorAll('.rows > .row, .month, .links > a, .hot, .banner').forEach(el => {
    if (el.classList.contains('rv')) return;
    el.classList.add('rv');
    revealIO.observe(el);
  });
  setTimeout(revealVisible, 1200);
}
// Zabezpieczenie: gdyby obserwator się nie odezwał, odsłoń wszystko, co jest na ekranie.
function revealVisible() {
  document.querySelectorAll('.rv:not(.in)').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width && r.top < innerHeight && r.bottom > 0) el.classList.add('in');
  });
}
if (MOTION) {
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    setTimeout(() => { ticking = false; revealVisible(); }, 400);
  }, { passive: true });
}

const photoSrcset = src => [960, 1280, 1920].map(w => `${src.replace('/1280px-', `/${w}px-`)} ${w}w`).join(', ');
function renderBanners() {
  document.querySelectorAll('section.sheet[data-tab]').forEach(sec => {
    const p = PHOTOS[sec.dataset.tab];
    if (!p || sec.hasAttribute('data-nobanner')) return;
    let fig = sec.firstElementChild && sec.firstElementChild.matches('figure.banner') ? sec.firstElementChild : null;
    if (!fig) {
      fig = document.createElement('figure');
      fig.className = 'banner';
      fig.innerHTML = `<img src="${esc(p.src)}" srcset="${esc(photoSrcset(p.src))}" sizes="(max-width: 1150px) 100vw, 1120px" loading="lazy" decoding="async" style="object-position:${esc(p.pos)}" alt=""><figcaption></figcaption>`;
      fig.querySelector('img').addEventListener('error', () => { fig.hidden = true; });
      sec.prepend(fig);
    }
    const lic = lang === 'en' && p.licEn ? p.licEn : p.lic;
    const licHtml = p.licUrl ? `<a href="${esc(p.licUrl)}" target="_blank" rel="noopener license">${esc(lic)}</a>` : esc(lic);
    fig.querySelector('img').alt = p.alt[lang] || p.alt.pl;
    fig.querySelector('figcaption').innerHTML = `${esc(T.photo)} <a href="${esc(p.page)}" target="_blank" rel="noopener">${esc(p.author)}</a> · ${licHtml} · Wikimedia Commons`;
  });
  reveal(document.querySelector('main'));
}

let counted = false;
function countUp() {
  if (counted) return;
  counted = true;
  if (!MOTION) return;
  document.querySelectorAll('#stats .stat b').forEach(b => {
    const to = parseInt(b.textContent, 10);
    if (!(to > 0)) return;
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur);
      b.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    b.textContent = '0';
    requestAnimationFrame(step);
    setTimeout(() => { b.textContent = to; }, dur + 400);   // gwarancja końcowej wartości (np. karta w tle)
  });
}

/* ============ ZAKŁADKI ============ */
function currentTab() {
  const h = decodeURIComponent(location.hash.slice(1));
  return TABS.includes(h) ? h : TABS[0];
}
function showTab(fromClick) {
  const tab = currentTab();
  document.querySelectorAll('[data-tab]').forEach(s => { s.hidden = s.dataset.tab !== tab; });
  document.querySelectorAll('nav.tabs a').forEach(a => {
    const on = a.getAttribute('href') === '#' + tab;
    if (on) {
      a.setAttribute('aria-current', 'page');
      const w = a.parentElement;   // przewiń pasek w poziomie, żeby aktywna zakładka była widoczna (telefon)
      if (a.offsetLeft < w.scrollLeft || a.offsetLeft + a.offsetWidth > w.scrollLeft + w.clientWidth) w.scrollLeft = Math.max(0, a.offsetLeft - 16);
    } else a.removeAttribute('aria-current');
  });
  if (fromClick) {
    const top = $('.tb').offsetHeight;   // wróć do początku treści, jeśli strona była przewinięta niżej
    if (window.scrollY > top) window.scrollTo(0, top);
    const sec = document.querySelector(`[data-tab="${tab}"]`);
    if (sec && MOTION) { sec.classList.remove('enter'); void sec.offsetWidth; sec.classList.add('enter'); }   // płynne wejście zakładki
  }
}

run().catch(fail);
renderNews();
loadNews();
renderNorms();
loadNorms();
renderEvents();
renderQuiz();
})();
